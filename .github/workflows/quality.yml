name: Full-Stack Quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/student_dashboard_test
      JWT_SECRET: integration-test-secret-at-least-32-characters-long
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Run backend tests
        run: npm test

      - name: Audit backend runtime dependencies
        run: npm audit --omit=dev --audit-level=critical

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build backend image
        run: docker build --file backend/Dockerfile --tag student-dashboard-backend:ci .

      - name: Build frontend image
        run: docker build --file frontend/Dockerfile --tag student-dashboard-frontend:ci frontend

      - name: Smoke test the Compose stack
        run: |
          trap 'docker compose down -v' EXIT
          if ! docker compose up -d --build; then
            docker compose ps -a
            docker compose logs backend mongo frontend
            exit 1
          fi
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health/ready > /tmp/readiness.json; then
              cat /tmp/readiness.json
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:5000/health
          curl --fail --silent http://127.0.0.1:8080/ > /dev/null
          docker compose ps
