services:
  - type: web
    runtime: node
    name: student-dashboard-api
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: REDIS_REST_URL
        sync: false
      - key: REDIS_REST_TOKEN
        sync: false

  - type: web
    runtime: static
    name: student-dashboard-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=()"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
