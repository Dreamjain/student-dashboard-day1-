services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # Compose is the documented local-development stack. Production deployments
      # must provide NODE_ENV=production plus a shared Redis REST store.
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/student_dashboard
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-before-production}
      CLIENT_ORIGIN: http://localhost:8080
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo_data:
